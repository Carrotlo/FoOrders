# Public manage-order menu.
title: "&8ᴍᴀɴᴀɢᴇ ᴏʀᴅᴇʀ"

items:
  cancel:
    slot: 11
    material: RED_TERRACOTTA
    name: "#ff5d73&lCANCEL"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fCancel this order."
      - " "
      - "{good}→ Click to Cancel ←"
  claim:
    slot: 14
    material: CHEST
    name: "#3ecf8e&lCLAIM ORDER"
    stack-line: "#a7b8b0- {amount}x {item}"
    more-line: "#a7b8b0And {count} more"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "{claim_stacks}"
      - " "
      - "{good}→ Click to claim order ←"
  admin-actions:
    material: LAVA_BUCKET
    name: "#ff5d73&lADMIN ACTIONS"
    refund-line: "#ffffffRefund owner: {theme}${refund}"
    no-refund-line: "#a7b8b0No refund remaining"
    lore:
      - "#ffffffOpen admin moderation for this order"
      - "{refund_line}"
