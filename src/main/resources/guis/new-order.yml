title: "&8ɴᴇᴡ ᴏʀᴅᴇʀ"
rows: 3
filler:
  enabled: false
buttons:
  cancel:
    slot: 10
    enabled: true
    material: "RED_STAINED_GLASS_PANE"
    name: ":red_stained_glass_pane: #ff5d73&lCANCEL"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fDiscard this order draft."
      - " "
      - "{good}→ Click to Cancel ←"
    amount: 1
    item-flags:
      - "HIDE_ENCHANTS"
      - "HIDE_ATTRIBUTES"
      - "HIDE_UNBREAKABLE"
      - "HIDE_DESTROYS"
      - "HIDE_PLACED_ON"
      - "HIDE_ADDITIONAL_TOOLTIP"
      - "HIDE_DYE"
      - "HIDE_ARMOR_TRIM"
      - "HIDE_STORED_ENCHANTS"
    action: "orders.new-order.cancel"
  amount:
    slot: 13
    enabled: true
    material: "CHEST"
    name: ":chest_minecart: {theme}&lAMOUNT"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fCurrent amount: {amount}"
      - " "
      - "{good}→ Click to Set Amount ←"
    amount: 1
    item-flags:
      - "HIDE_ENCHANTS"
      - "HIDE_ATTRIBUTES"
      - "HIDE_UNBREAKABLE"
      - "HIDE_DESTROYS"
      - "HIDE_PLACED_ON"
      - "HIDE_ADDITIONAL_TOOLTIP"
      - "HIDE_DYE"
      - "HIDE_ARMOR_TRIM"
      - "HIDE_STORED_ENCHANTS"
    action: "orders.new-order.amount"
  price:
    slot: 14
    enabled: true
    material: "EMERALD"
    name: ":emerald: {theme}&lPRICE"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fPrice per item: ${price}"
      - " "
      - "{good}→ Click to Set Price ←"
    amount: 1
    item-flags:
      - "HIDE_ENCHANTS"
      - "HIDE_ATTRIBUTES"
      - "HIDE_UNBREAKABLE"
      - "HIDE_DESTROYS"
      - "HIDE_PLACED_ON"
      - "HIDE_ADDITIONAL_TOOLTIP"
      - "HIDE_DYE"
      - "HIDE_ARMOR_TRIM"
      - "HIDE_STORED_ENCHANTS"
    action: "orders.new-order.price"
  confirm:
    slot: 16
    enabled: true
    material: "LIME_STAINED_GLASS_PANE"
    name: ":lime_stained_glass_pane: #3ecf8e&lCONFIRM"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fSubtotal: {theme}${subtotal}"
      - "&7&l | &fTax ({tax_percent}%): {theme}${tax}"
      - "&7&l | &fTotal: #3ecf8e${total}"
      - " "
      - "{good}→ Click to Confirm Order ←"
    amount: 1
    item-flags:
      - "HIDE_ENCHANTS"
      - "HIDE_ATTRIBUTES"
      - "HIDE_UNBREAKABLE"
      - "HIDE_DESTROYS"
      - "HIDE_PLACED_ON"
      - "HIDE_ADDITIONAL_TOOLTIP"
      - "HIDE_DYE"
      - "HIDE_ARMOR_TRIM"
      - "HIDE_STORED_ENCHANTS"
    action: "orders.new-order.confirm"
    states:
      taxed:
        material: "LIME_STAINED_GLASS_PANE"
        name: ":lime_stained_glass_pane: #3ecf8e&lCONFIRM"
        lore:
          - "&8ʙᴜᴛᴛᴏɴ"
          - " "
          - "&eⓘ Information ↓"
          - "&7&l | &fSubtotal: {theme}${subtotal}"
          - "&7&l | &fTax ({tax_percent}%): {theme}${tax}"
          - "&7&l | &fTotal: #3ecf8e${total}"
          - " "
          - "{good}→ Click to Confirm Order ←"
        amount: 1
        item-flags:
          - "HIDE_ENCHANTS"
          - "HIDE_ATTRIBUTES"
          - "HIDE_UNBREAKABLE"
          - "HIDE_DESTROYS"
          - "HIDE_PLACED_ON"
          - "HIDE_ADDITIONAL_TOOLTIP"
          - "HIDE_DYE"
          - "HIDE_ARMOR_TRIM"
          - "HIDE_STORED_ENCHANTS"
      untaxed:
        material: "LIME_STAINED_GLASS_PANE"
        name: ":lime_stained_glass_pane: #3ecf8e&lCONFIRM"
        lore:
          - "&8ʙᴜᴛᴛᴏɴ"
          - " "
          - "&eⓘ Information ↓"
          - "&7&l | &fSubtotal: {theme}${subtotal}"
          - "&7&l | &fTotal: #3ecf8e${total}"
          - " "
          - "{good}→ Click to Confirm Order ←"
        amount: 1
        item-flags:
          - "HIDE_ENCHANTS"
          - "HIDE_ATTRIBUTES"
          - "HIDE_UNBREAKABLE"
          - "HIDE_DESTROYS"
          - "HIDE_PLACED_ON"
          - "HIDE_ADDITIONAL_TOOLTIP"
          - "HIDE_DYE"
          - "HIDE_ARMOR_TRIM"
          - "HIDE_STORED_ENCHANTS"
  enchants:
    material: "ENCHANTED_BOOK"
    name: ":enchanted_book: {theme}&lENCHANTS"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fConfigure item enchantments."
      - "{options}"
      - " "
      - "{good}→ Click to Edit Enchants ←"
    amount: 1
    item-flags:
      - "HIDE_ENCHANTS"
      - "HIDE_ATTRIBUTES"
      - "HIDE_UNBREAKABLE"
      - "HIDE_DESTROYS"
      - "HIDE_PLACED_ON"
      - "HIDE_ADDITIONAL_TOOLTIP"
      - "HIDE_DYE"
      - "HIDE_ARMOR_TRIM"
      - "HIDE_STORED_ENCHANTS"
    slot: 15
    enabled: true
    action: "orders.new-order.enchants"
    cycle:
      selected-format: "{option}"
      unselected-format: "{option}"
    states:
      hidden:
        visible: false
        clickable: false
entries:
  item:
    slots:
      - 12
    enabled: true
    source-item:
      default-name: "{theme}&lITEM"
      amount: 1
      lore:
        mode: "replace"
        lines:
          - "&8ʙᴜᴛᴛᴏɴ"
          - " "
          - "&eⓘ Information ↓"
          - "&7&l | &fSelected: {item}"
          - " "
          - "{good}→ Click to Choose Item ←"
      item-flags:
        - "HIDE_ENCHANTS"
        - "HIDE_ATTRIBUTES"
        - "HIDE_UNBREAKABLE"
        - "HIDE_DESTROYS"
        - "HIDE_PLACED_ON"
        - "HIDE_ADDITIONAL_TOOLTIP"
        - "HIDE_DYE"
        - "HIDE_ARMOR_TRIM"
        - "HIDE_STORED_ENCHANTS"
    actions:
      left: "orders.new-order.item"
