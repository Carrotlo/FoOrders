# Editable GUI text and button materials for FoOrders inventory menus.
# Use the colour tokens from messages.yml ({theme}, {white}, {muted}, {error},
# {success}, and any you add there), #RRGGBB hex, or & color codes. Dynamic placeholders are listed beside each item where supported.
# Slot numbers are 0-based Minecraft inventory slots.
titles:
  main: "&8ᴏʀᴅᴇʀꜱ (Page {page})"
  your-orders: "&8ʏᴏᴜʀ ᴏʀᴅᴇʀꜱ"
  new-order: "&8ɴᴇᴡ ᴏʀᴅᴇʀ"
  item-select: "&8ꜱᴇʟᴇᴄᴛ ɪᴛᴇᴍ"
  enchant-select: "&8ᴇɴᴄʜᴀɴᴛꜱ"
  manage-order: "&8ᴍᴀɴᴀɢᴇ ᴏʀᴅᴇʀ"
  claim-order: "&8ᴄʟᴀɪᴍ ᴏʀᴅᴇʀ"
  deliver: "&8ᴅᴇʟɪᴠᴇʀ"
  delivery-confirm: "&8ᴄᴏɴꜰɪʀᴍᴀᴛɪᴏɴ"
  history: "&8ʜɪꜱᴛᴏʀʏ • {tab}"

labels:
  main-sort-options:
    - "Most Paid"
    - "Most Delivered"
    - "Recently Listed"
    - "Most Money Per Item"
  item-sort-options:
    - "A-Z"
    - "Z-A"
  filter-options:
    - "All"
    - "Blocks"
    - "Tools"
    - "Food"
    - "Combat"
    - "Potions"
    - "Books"
    - "Ingredients"
    - "Utilities"

# How each option is drawn inside a cycling Sort or Filter button. {label} is
# the option's own text from the labels section above, so both the marker
# character and its colour are yours to change - swap the arrows for ">", "▶"
# or "✔", or drop them entirely and just colour the whole line.
selectors:
  main-sort:
    selected: "{theme}» {label}"
    unselected: "{white}• {label}"
  main-filter:
    selected: "{theme}» {label}"
    unselected: "{white}• {label}"
  item-sort:
    selected: "{theme}» {label}"
    unselected: "{white}• {label}"
  item-filter:
    selected: "{theme}» {label}"
    unselected: "{white}• {label}"

layout:
  main:
    # Dynamic order entry slots. 0-based inventory slots.
    # Default: rows 2-4, columns 2-8. First and last column stay filler panes.
    order-slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34

buttons:
  # Shared button appearance for public FoOrders inventory menus.
  # Per-menu slot placement stays under items.<menu>.<button>.slot.
  back:
    material: IRON_DOOR
    name: "{theme}ʙᴀᴄᴋ"
    lore:
      - "{white}Click to return"
  previous-page:
    material: ARROW
    name: "{theme}ᴘʀᴇᴠɪᴏᴜꜱ ᴘᴀɢᴇ"
    lore:
      - "{white}Page {page}/{max_page}"
  next-page:
    material: ARROW
    name: "{theme}ɴᴇxᴛ ᴘᴀɢᴇ"
    lore:
      - "{white}Page {page}/{max_page}"
  search:
    material: NAME_TAG
    name: "{theme}ꜱᴇᴀʀᴄʜ"
    lore:
      - "{white}Current: {current}"
      - "{white}Click to search"

items:
  # Shared back/page/search button appearance is controlled by the buttons section above.
  # These entries only keep per-menu slot placement here.
  main:
    gray-pane:
      material: GRAY_STAINED_GLASS_PANE
      name: ""
    black-pane:
      material: GRAY_STAINED_GLASS_PANE
      name: ""
    empty-order-slot:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      name: ""
    order-entry:
      # Dynamic item shown for every order profile in /order, /order -> Your Orders, and admin previews.
      # The icon stays the ordered item. These settings only change the visible name/lore text.
      # Placeholders: {owner}, {item}, {material}, {amount}, {amount_ordered}, {delivered}, {amount_delivered}, {amount_left}, {price}, {price_each}, {total}, {paid}, {paid_left}
      # {price} and {price_each} both mean the per-item price without a dollar sign, so use ${price} if you want "$10 each".
      name: "{theme}{owner}'s Order"
      lore:
        # Amount line for the ordered item.
        amount: "{theme}{amount} {white}{item}"
        # Per-item price line. Change "each" here if you want different wording.
        price: "{theme}${price} {white}each"
        # Delivered progress line.
        delivered: "{progress}{delivered}/{progress-done}{amount} {progress-label}Delivered"
        # Paid progress line.
        paid: "{progress}${paid}/{progress-done}${total} {progress-label}Paid"
    previous-page:
      slot: 45
    next-page:
      slot: 53
    sort:
      slot: 47
      material: CAULDRON
      name: "{theme}ꜱᴏʀᴛ"
    filter:
      slot: 48
      material: HOPPER
      name: "{theme}ꜰɪʟᴛᴇʀ"
    refresh:
      slot: 49
      material: MAP
      name: "{theme}ᴏʀᴅᴇʀꜱ"
      lore:
        - "{white}Click to refresh"
    search:
      slot: 50
    your-orders:
      slot: 51
      material: BOOK
      name: "{theme}ʏᴏᴜʀ ᴏʀᴅᴇʀꜱ"
      lore:
        - "{white}Click to view your orders"
    history:
      slot: 52
      material: WRITABLE_BOOK
      name: "{theme}ʜɪꜱᴛᴏʀʏ"
      lore:
        - "{white}Click to view order history"
        - "{white}Switch between order and deliver tabs"

  your-orders:
    new-order:
      slot: 26
      material: MAP
      name: "{theme}New Order"
      lore:
        - "{white}Click to create new order"

  new-order:
    cancel:
      slot: 10
      material: RED_STAINED_GLASS_PANE
      name: "{error}ᴄᴀɴᴄᴇʟ"
      lore:
        - "{white}Click to return"
    item:
      slot: 12
      name: "{theme}ɪᴛᴇᴍ"
    amount:
      slot: 13
      material: CHEST
      name: "{theme}ᴀᴍᴏᴜɴᴛ"
      lore:
        - "{white}Click to type number of items"
        - "{muted}({amount})"
    price:
      slot: 14
      material: EMERALD
      name: "{theme}ᴘʀɪᴄᴇ"
      lore:
        - "{white}Click to type the price per item"
        - "{muted}(${price})"
    enchants:
      slot: 15
      material: ENCHANTED_BOOK
      name: "{theme}ᴇɴᴄʜᴀɴᴛꜱ"
    confirm:
      slot: 16
      material: LIME_STAINED_GLASS_PANE
      name: "{success}ᴄᴏɴꜰɪʀᴍ"
      lore:
        - "{white}Click to confirm order"
        - "{muted}Subtotal: {theme}${subtotal}"
        - "{muted}Tax ({tax_percent}%): {theme}${tax}"
        - "{muted}Total: {success}${total}"

  item-select:
    # Every orderable vanilla material in the item picker. The icon is always
    # the item itself; only its name and lore come from here.
    # Placeholders: {item}, {material}
    entry:
      name: "{theme}{item}"
      lore:
        - "{white}Click to Select"
    # Admin-made custom items in the picker. Their own name and lore come from
    # the saved template; these lines are appended underneath it.
    # Placeholders: {item}, {id}, {enchants}
    custom-entry:
      name: "{theme}{item}"
      lore:
        - ""
        - "{muted}Custom Item"
        - "{muted}ID: {id}"
        - "{white}Order enchants: {enchants}"
        - "{white}Click to Select"
      # What {enchants} above becomes for each state.
      enchants-enabled: "{success}Enabled"
      enchants-disabled: "{error}Disabled"
    sort:
      slot: 48
      material: CAULDRON
      name: "{theme}ꜱᴏʀᴛ"
    filter:
      slot: 49
      material: HOPPER
      name: "{theme}ꜰɪʟᴛᴇʀ"
    search:
      slot: 50
    previous-page:
      slot: 45
    next-page:
      slot: 53

  enchant-select:
    # One enchantment in the enchant picker, before any level is chosen.
    # Placeholders: {enchantment}, {current}, {current_level}, {max}, {max_level}, {item}, {material}
    entry:
      material: BOOK
      name: "{theme}{enchantment}"
      lore:
        - "{muted}Current: {current}"
        - "{muted}Max: {max}"
        - "{muted}For {item}"
        - ""
        - "{white}Left click: +1 level"
        - "{white}Right click: -1 level"
        - "{white}Shift + Left: +5 levels"
        - "{white}Shift + Right: -5 levels"
      # How {current} and {max} render a level. {roman} is the Roman numeral,
      # {level} the plain number - drop either if you only want one.
      level: "{theme}{roman}{white} ({level})"
      # What {current} shows when no level is picked yet.
      level-none: "{theme}None"
    # Same entry once a level is picked. Give it a different material or colour
    # to make the chosen enchantments stand out.
    entry-selected:
      material: ENCHANTED_BOOK
      name: "{theme}{enchantment}"
      lore:
        - "{muted}Current: {current}"
        - "{muted}Max: {max}"
        - "{muted}For {item}"
        - ""
        - "{white}Left click: +1 level"
        - "{white}Right click: -1 level"
        - "{white}Shift + Left: +5 levels"
        - "{white}Shift + Right: -5 levels"
    previous-page:
      slot: 45
    next-page:
      slot: 53
    clear:
      slot: 48
      material: RED_TERRACOTTA
      name: "{error}ᴄʟᴇᴀʀ"
      lore:
        - "{white}Click to remove all selected enchantments"
    done:
      slot: 49
      material: LIME_STAINED_GLASS_PANE
      name: "{success}ᴅᴏɴᴇ"
      lore:
        - "{white}Click to return"
        - "{muted}({selected} selected)"
    controls:
      slot: 50
      material: OAK_SIGN
      name: "{theme}ᴄᴏɴᴛʀᴏʟꜱ"
      lore:
        - "{white}Left click: +1 level"
        - "{white}Right click: -1 level"
        - "{white}Shift + Left: +5 levels"
        - "{white}Shift + Right: -5 levels"

  manage-order:
    cancel:
      slot: 11
      material: RED_TERRACOTTA
      name: "{error}ᴄᴀɴᴄᴇʟ"
      lore:
        - "{white}Click to cancel your order"
    claim:
      slot: 14
      material: CHEST
      name: "{success}ᴄʟᴀɪᴍ ᴏʀᴅᴇʀ"
      # The claim button lists the stacks waiting to be collected, at most five
      # lines. Placeholders: {amount}, {item}
      stack-line: "{muted}- {amount}x {item}"
      # Shown instead of the last stack line when there are more than fit.
      more-line: "{muted}And {amount} more"

  claim-order:
    previous-page:
      slot: 45
    next-page:
      slot: 53
    drop-page:
      slot: 52
      material: DISPENSER
      name: "{muted}ᴅʀᴏᴘ ᴘᴀɢᴇ"
      lore:
        - "{white}Drop all items on the page"

  delivery-confirm:
    cancel:
      slot: 11
      material: RED_STAINED_GLASS_PANE
      name: "{error}ᴄᴀɴᴄᴇʟ"
      lore:
        - "{white}Click to return"
    confirm:
      slot: 15
      material: LIME_STAINED_GLASS_PANE
      name: "{success}ᴄᴏɴꜰɪʀᴍ"
      lore:
        - "{white}Click to confirm order"

  history:
    info:
      slot: 46
      material: OAK_SIGN
      name: "{theme}ᴠɪᴇᴡɪɴɢ"
      lore:
        - "{white}{target}"
        - "{muted}Page {page}/{pages}"
        - "{muted}Entries: {entries}"
    # The two history tabs, each with a separate look for when it is the tab
    # being viewed and when it is not.
    order-tab:
      slot: 48
      material: BOOK
      name: "{theme}ᴏʀᴅᴇʀ ʜɪꜱᴛᴏʀʏ"
      lore:
        - "{white}Click to switch"
    order-tab-active:
      material: WRITABLE_BOOK
      name: "{success}ᴏʀᴅᴇʀ ʜɪꜱᴛᴏʀʏ"
      lore:
        - "{muted}Current tab"
    deliver-tab:
      slot: 50
      material: CHEST_MINECART
      name: "{theme}ᴅᴇʟɪᴠᴇʀ ʜɪꜱᴛᴏʀʏ"
      lore:
        - "{white}Click to switch"
    deliver-tab-active:
      material: MINECART
      name: "{success}ᴅᴇʟɪᴠᴇʀ ʜɪꜱᴛᴏʀʏ"
      lore:
        - "{muted}Current tab"
    back-to-orders:
      slot: 49
    previous-page:
      slot: 45
    next-page:
      slot: 53
    entry:
      name: "{theme}{action}"
      lore:
        - "{white}{details}"
        - "{muted}Player: {target}"
        - "{muted}Time: {time}"

# Reusable text fragments the menus build names and lore out of.
formats:
  # One line of the enchantment list on the New Order enchants button.
  # Placeholders: {enchantment}, {roman}, {level}
  enchantment-summary-line: "{muted}- {enchantment} {roman}"
  # How an enchanted item's name is written, e.g. "Diamond Sword (Sharpness V, +2)".
  # {name} is the plain item name, {enchants} the joined parts below.
  enchantment-name: "{name} ({enchants})"
  # One enchantment inside {enchants}. Placeholders: {enchantment}, {roman}, {level}
  enchantment-name-part: "{enchantment} {roman}"
  # What sits between those parts.
  enchantment-name-separator: ", "
  # Stands in for the enchantments past the first two. Placeholder: {count}
  enchantment-name-overflow: "+{count}"
