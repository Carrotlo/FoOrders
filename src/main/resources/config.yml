# Need help or want support? Join the Discord: https://discord.gg/kEF77QCfu7

# Default maximum orders a player can have.
max-order-per-player: 3

# Minimum time between repeated /order menu opens from the same player.
# Set to 0 to disable the cooldown.
order-menu-refresh-cooldown-ms: 50

# Extra percentage charged when a player creates a new order.
# This is a one-time creation tax and is not paid to deliverers or refunded when the order is cancelled.
order-tax:
  percentage: 0

# File logging works like debug mode and saves plugin activity to logs/latest.log. Default: false
file-logging: false

# Uses Minecraft's native dialog/input screens for search and text/number input when supported.
# Requires a compatible Paper or Paper-fork server with the Dialog API.
# Spigot and older versions automatically fall back to chat input mode.
# Set this to false to always use chat input mode.
native-dialogs:
  enabled: true
  # Uses native dialogs for choosing the item in the new order flow when available.
  # Set this to false to always use the inventory item selection GUI.
  item-selection: true
  # Sends admins one warning when native dialogs are enabled but unavailable and the plugin falls back.
  warn-on-fallback: true
  # How wide each item button is, in pixels.
  # "auto" sizes every button to the longest item name currently shown, so
  # nothing is cut off. Set a number instead to force a fixed width.
  item-selection-button-width: auto
  # How many item buttons sit side by side in a row. Lower this if the dialog
  # is wider than your screen; raise it to fit more items per row.
  item-selection-columns: 3
  # How many item buttons one item selection dialog may show at once.
  # The whole dialog is sent in a single packet, so every orderable item cannot
  # fit at once; players reach the rest through the search box. Raise carefully.
  item-selection-max-buttons: 256

# Broadcast a global chat message when a new order is created.
announce-created-orders-in-chat: false

history:
  # Master switch for all history recording and viewing.
  enabled: true
  # Allows normal players to open their own history from the main orders GUI.
  players-can-view-own: true
  # Allows admins to open any player's history with /orderadmin history <player>.
  admins-can-view-any: true
  # Maximum stored entries per history type (order/deliver) for each player.
  max-entries-per-type: 100
  # How the time on each history entry is written, in Java date/time pattern
  # syntax. Uses the server's own time zone. Examples: "dd/MM/yyyy HH:mm",
  # "MMM d, h:mm a", "HH:mm".
  timestamp-format: "yyyy-MM-dd HH:mm"

discord-webhook:
  # Master switch for all webhook messages.
  enabled: true

  # Discord webhook URL (for example: https://discord.com/api/webhooks/<id>/<token>)
  # If this is empty or invalid, the plugin simply skips webhook sending.
  webhook-url: ""

  # Webhook display name. Leave blank to use FoOrders.
  username: ""

  # Optional webhook avatar image URL.
  avatar-url: ""

  # Logs the first webhook send failure until a later send succeeds.
  log-failures: true

  # Enable/disable each webhook category.
  # Defaults are enabled for creating/cancelling/admin moderation.
  events:
    creating-orders: true
    cancelling-orders: true
    delivering-orders: false
    claiming-orders: false
    admin-cancelling-or-deleting: true

# Block items players cannot obtain in survival: command blocks, bedrock,
# barriers, light blocks, debug sticks, structure blocks, spawners, spawn eggs
# and similar. They are hidden from the item picker and refused at order
# creation.
block-creative-only-items: true

# Materials to keep orderable despite the setting above, for servers that
# legitimately sell one of them. Ignored when block-creative-only-items is false.
creative-only-exceptions: []
#  - spawner

# Extra materials that cannot be ordered, on top of the creative-only block.
# Supports names like "barrier" or "minecraft:barrier".
blacklist-items: []

# Display names that cannot be ordered (checked independently from material blacklist).
blacklist-names:
  - test_blacklisted_name

# How many orders one page of the /order menu shows.
# 0 uses every configured order slot (21 by default), so the page arrows only
# appear once there are more orders than fit. Set a lower number to page sooner.
main-orders-per-page: 0

# Sounds played for menu actions. Set enabled to false to silence all of them,
# or blank out a single sound to silence just that one.
# Each entry accepts a plain sound name, or a section with sound/volume/pitch.
sounds:
  enabled: true
  click:
    sound: ui.button.click
    volume: 0.6
    pitch: 1.0
  page-turn:
    sound: item.book.page_turn
    volume: 0.7
    pitch: 1.0
  open:
    sound: block.chest.open
    volume: 0.5
    pitch: 1.2
  success:
    sound: entity.experience_orb.pickup
    volume: 0.7
    pitch: 1.2
  error:
    sound: block.note_block.bass
    volume: 0.6
    pitch: 0.8
