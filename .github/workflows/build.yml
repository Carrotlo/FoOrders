name: Build JAR

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install fo-plugin-core stubs
        run: mvn -f fo-plugin-core-stubs/pom.xml clean install --batch-mode

      - name: Build with Maven
        run: mvn clean package --batch-mode

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoOrders
          path: target/FoOrders-*.jar
          if-no-files-found: error
