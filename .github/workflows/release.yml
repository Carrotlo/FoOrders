name: Release JAR

on:
  release:
    types: [ published ]

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install fo-plugin-core stubs
        run: mvn -f fo-plugin-core-stubs/pom.xml clean install --batch-mode

      - name: Build with Maven
        run: mvn clean package --batch-mode

      - name: Upload JAR to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/FoOrders-*.jar
